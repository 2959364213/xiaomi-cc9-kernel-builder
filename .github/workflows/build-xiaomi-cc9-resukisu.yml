name: Build Xiaomi CC9 Kernel with ReSukiSU

on:
  workflow_dispatch:
    inputs:
      resukisu_ref:
        description: "ReSukiSU branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_BRANCH: pyxis-p-oss
  DEFCONFIG: pyxis_user_defconfig
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_REF: ${{ inputs.resukisu_ref }}

jobs:
  build:
    name: Build pyxis 4.9 + ReSukiSU
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            gcc-multilib \
            g++-multilib \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            liblz4-tool \
            lzop \
            make \
            perl \
            python2 \
            python3 \
            python-is-python2 \
            rsync \
            unzip \
            wget \
            zip

      - name: Clone Xiaomi kernel source
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

      - name: Integrate ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "Integrating ReSukiSU ref: ${RESUKISU_REF}"

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | sh -s -- "${RESUKISU_REF}"

          test -d KernelSU
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test "$(git -C KernelSU remote get-url origin)" = "${RESUKISU_REPO}"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          git -C KernelSU rev-parse HEAD | tee "${GITHUB_WORKSPACE}/resukisu-commit.txt"
          git -C KernelSU describe --tags --always --dirty \
            | tee "${GITHUB_WORKSPACE}/resukisu-version.txt"

      - name: Apply ReSukiSU manual hooks for Linux 4.9
        working-directory: kernel
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          def fail(message):
              print(f"PATCH ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def insert_before(path, marker, block):
              text = load(path)
              if block.strip() in text:
                  print(f"{path}: declaration already present")
                  return
              count = text.count(marker)
              if count != 1:
                  fail(f"{path}: expected one marker {marker!r}, found {count}")
              save(path, text.replace(marker, block + marker, 1))
              print(f"{path}: declaration inserted")

          def replace_regex(path, pattern, replacement, expected, flags=0):
              text = load(path)
              new_text, count = re.subn(
                  pattern,
                  lambda match: match.expand(replacement),
                  text,
                  flags=flags,
              )
              if count != expected:
                  fail(f"{path}: expected {expected} replacements, found {count}")
              save(path, new_text)
              print(f"{path}: applied {count} replacement(s)")

          def inject_simple_function(path, function_marker, hook):
              text = load(path)
              start = text.find(function_marker)
              if start < 0:
                  fail(f"{path}: function marker not found: {function_marker}")
              end = text.find("\n}", start)
              if end < 0:
                  fail(f"{path}: function end not found: {function_marker}")
              segment = text[start:end]
              if hook.strip() in segment:
                  print(f"{path}: hook already present in {function_marker}")
                  return
              return_pos = segment.rfind("\n\treturn error;")
              if return_pos < 0:
                  return_pos = segment.rfind("\n        return error;")
              if return_pos < 0:
                  fail(f"{path}: return statement not found in {function_marker}")
              segment = segment[:return_pos] + "\n" + hook.rstrip("\n") + segment[return_pos:]
              save(path, text[:start] + segment + text[end:])
              print(f"{path}: hooked {function_marker}")

          stat_declarations = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);
          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          """

          insert_before(
              "fs/stat.c",
              "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)",
              stat_declarations,
          )

          replace_regex(
              "fs/stat.c",
              r"(^[ \t]*int error;[ \t]*\n)(?:[ \t]*\n)*"
              r"(^[ \t]*error = vfs_fstatat\(dfd, filename, &stat, flag\);)",
              r"\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              r"\tksu_handle_stat(&dfd, &filename, &flag);\n"
              r"#endif\n\2",
              expected=2,
              flags=re.MULTILINE,
          )

          inject_simple_function(
              "fs/stat.c",
              "SYSCALL_DEFINE2(newfstat,",
              """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """,
          )

          inject_simple_function(
              "fs/stat.c",
              "SYSCALL_DEFINE2(fstat64,",
              """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          """,
          )

          exec_declaration = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
                                         struct filename **filename_ptr,
                                         void *argv,
                                         void *envp,
                                         int *flags);
          #endif

          """

          insert_before(
              "fs/exec.c",
              "static int do_execveat_common(",
              exec_declaration,
          )

          exec_text = load("fs/exec.c")
          exec_start = exec_text.find("static int do_execveat_common(")
          if exec_start < 0:
              fail("fs/exec.c: do_execveat_common not found")
          exec_window_end = exec_start + 2500
          exec_window = exec_text[exec_start:exec_window_end]
          exec_hook = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          #endif
          """
          if exec_hook.strip() not in exec_window:
              pattern = (
                  r"(if \(IS_ERR\(filename\)\)[ \t]*\n"
                  r"[ \t]*return PTR_ERR\(filename\);[ \t]*\n)"
              )
              new_window, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + "\n" + exec_hook,
                  exec_window,
                  count=1,
              )
              if count != 1:
                  fail("fs/exec.c: failed to locate IS_ERR(filename) guard")
              exec_text = (
                  exec_text[:exec_start]
                  + new_window
                  + exec_text[exec_window_end:]
              )
              save("fs/exec.c", exec_text)
              print("fs/exec.c: hooked do_execveat_common")
          else:
              print("fs/exec.c: exec hook already present")

          open_declaration = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
                                          const char __user **filename_user,
                                          int *mode,
                                          int *flags);
          #endif

          """

          insert_before(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat,",
              open_declaration,
          )

          replace_regex(
              "fs/open.c",
              r"(^[ \t]*unsigned int lookup_flags = LOOKUP_FOLLOW;[ \t]*\n)",
              r"\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              r"\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              r"#endif\n",
              expected=1,
              flags=re.MULTILINE,
          )

          reboot_declaration = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1,
                                           int magic2,
                                           unsigned int cmd,
                                           void __user **arg);
          #endif

          """

          insert_before(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot,",
              reboot_declaration,
          )

          reboot_text = load("kernel/reboot.c")
          reboot_start = reboot_text.find("SYSCALL_DEFINE4(reboot,")
          if reboot_start < 0:
              fail("kernel/reboot.c: reboot syscall not found")
          reboot_window_end = reboot_start + 1200
          reboot_window = reboot_text[reboot_start:reboot_window_end]
          reboot_hook = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          """
          if reboot_hook.strip() not in reboot_window:
              pattern = r"(^[ \t]*int ret = 0;[ \t]*\n)"
              new_window, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + "\n" + reboot_hook,
                  reboot_window,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  fail("kernel/reboot.c: failed to locate int ret = 0")
              reboot_text = (
                  reboot_text[:reboot_start]
                  + new_window
                  + reboot_text[reboot_window_end:]
              )
              save("kernel/reboot.c", reboot_text)
              print("kernel/reboot.c: reboot hook applied")
          else:
              print("kernel/reboot.c: reboot hook already present")

          required_checks = {
              "fs/stat.c": [
                  "ksu_handle_stat(&dfd, &filename, &flag);",
                  "ksu_handle_newfstat_ret(&fd, &statbuf);",
                  "ksu_handle_fstat64_ret(&fd, &statbuf);",
              ],
              "fs/exec.c": [
                  "ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);",
              ],
              "fs/open.c": [
                  "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);",
              ],
              "kernel/reboot.c": [
                  "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);",
              ],
          }

          for path, needles in required_checks.items():
              text = load(path)
              for needle in needles:
                  if needle not in text:
                      fail(f"{path}: required hook missing: {needle}")

          print("All required pyxis Linux 4.9 manual hooks were inserted.")
          PY

          git diff --check

          echo "Manual-hook call sites:"
          grep -n "ksu_handle_" \
            fs/stat.c \
            fs/exec.c \
            fs/open.c \
            kernel/reboot.c

      - name: Clone ARM64 GCC 4.9 toolchain
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

      - name: Clone ARM32 GCC 4.9 toolchain
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Show compiler version
        shell: bash
        run: |
          set -e

          ./gcc64/bin/aarch64-linux-android-gcc --version
          ./gcc32/bin/arm-linux-androideabi-gcc --version

      - name: Generate and configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"

          make O=out "${DEFCONFIG}"

          chmod +x scripts/config

          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --disable KSU_SUSFS

          make O=out olddefconfig

          echo "ReSukiSU kernel configuration:"
          grep -E \
            '^(CONFIG_KSU|# CONFIG_KSU|CONFIG_KALLSYMS_ALL)' \
            out/.config

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^# CONFIG_KSU_TRACEPOINT_HOOK is not set$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS is not set$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"

          make \
            O=out \
            -j"$(nproc)" \
            2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/kernel
          mkdir -p artifacts/dtb
          mkdir -p artifacts/modules
          mkdir -p artifacts/patches

          if [ -d kernel/out/arch/arm64/boot ]; then
            find kernel/out/arch/arm64/boot \
              -maxdepth 1 \
              -type f \
              -name 'Image*' \
              -exec cp -v {} artifacts/kernel/ \;

            find kernel/out/arch/arm64/boot/dts \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp -v {} artifacts/dtb/ \; \
              2>/dev/null || true
          fi

          if [ -d kernel/out ]; then
            find kernel/out \
              -type f \
              -name '*.ko' \
              -exec cp -v --parents {} artifacts/modules/ \; \
              2>/dev/null || true
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config artifacts/kernel/config
          fi

          if [ -d kernel/.git ]; then
            git -C kernel diff -- \
              fs/stat.c \
              fs/exec.c \
              fs/open.c \
              kernel/reboot.c \
              drivers/Makefile \
              drivers/Kconfig \
              > artifacts/patches/resukisu-pyxis-4.9.patch || true
          fi

          cp build.log artifacts/ 2>/dev/null || true
          cp resukisu-commit.txt artifacts/ 2>/dev/null || true
          cp resukisu-version.txt artifacts/ 2>/dev/null || true

          {
            echo "Kernel repository: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo "Defconfig: ${DEFCONFIG}"
            echo "ReSukiSU requested ref: ${RESUKISU_REF}"
            echo "GitHub run: ${GITHUB_RUN_NUMBER}"
          } > artifacts/build-info.txt

          echo "Collected files:"
          find artifacts -type f -print || true

      - name: Verify kernel image
        if: success()
        shell: bash
        run: |
          if ! find artifacts/kernel \
            -maxdepth 1 \
            -type f \
            -name 'Image*' | grep -q .; then
            echo "Kernel image was not generated."
            exit 1
          fi

      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-CC9-pyxis-ReSukiSU-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
