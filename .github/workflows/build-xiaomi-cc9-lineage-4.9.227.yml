name: Build Xiaomi CC9 LineageOS 4.9.227 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sdm710.git
  KERNEL_BRANCH: lineage-19.1
  KERNEL_COMMIT: 6be09aab2938bdd72411059b96a9bd17b82bf82b
  BASE_DEFCONFIG: vendor/sdm670-perf_defconfig
  COMMON_CONFIG: arch/arm64/configs/xiaomi/sdm710-common.config
  DEVICE_CONFIG: arch/arm64/configs/xiaomi/pyxis.config

jobs:
  build:
    name: Build clean pyxis Linux 4.9.227
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            gcc-multilib \
            g++-multilib \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            liblz4-tool \
            lzop \
            make \
            perl \
            python2 \
            python3 \
            python-is-python2 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Clone LineageOS SDM710 kernel
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          actual_commit="$(git -C kernel rev-parse HEAD)"
          echo "Kernel commit: ${actual_commit}"

          if [ "${actual_commit}" != "${KERNEL_COMMIT}" ]; then
            echo "Branch tip changed; fetching pinned commit ${KERNEL_COMMIT}."
            git -C kernel fetch --depth=1 origin "${KERNEL_COMMIT}"
            git -C kernel checkout --detach "${KERNEL_COMMIT}"
          fi

          test "$(awk -F ' *= *' '$1 == "VERSION" { print $2 }' kernel/Makefile)" = "4"
          test "$(awk -F ' *= *' '$1 == "PATCHLEVEL" { print $2 }' kernel/Makefile)" = "9"
          test "$(awk -F ' *= *' '$1 == "SUBLEVEL" { print $2 }' kernel/Makefile)" = "227"

          git -C kernel rev-parse HEAD | tee kernel-commit.txt

      - name: Fix LineageOS GCC forbidden warning
        working-directory: kernel
        shell: bash
        run: |
          set -e

          file=drivers/gpu/drm/msm/msm_atomic.c
          declaration='struct msm_drm_notifier notifier_data;'

          test "$(grep -Fc "${declaration}" "${file}")" = "1"
          sed -i "\\|${declaration}|d" "${file}"

          if grep -Fq "${declaration}" "${file}"; then
            echo "Failed to remove the unused notifier_data declaration."
            exit 1
          fi

          git diff --check
          git diff -- "${file}"

      - name: Clone ARM64 GCC 4.9 toolchain
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

      - name: Clone ARM32 GCC 4.9 toolchain
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Configure pyxis kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"

          make O=out "${BASE_DEFCONFIG}"

          scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            "${COMMON_CONFIG}" \
            "${DEVICE_CONFIG}"

          make O=out olddefconfig

          echo "Final configuration fragments:"
          grep -E \
            '^(CONFIG_LOCALVERSION|CONFIG_ARCH_SDM670|CONFIG_MACH_XIAOMI|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE)' \
            out/.config || true

          grep -q '^CONFIG_ARCH_SDM670=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_PYXIS=y$' out/.config

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"

          make \
            O=out \
            -j"$(nproc)" \
            Image \
            Image.gz \
            dtbs \
            modules \
            2>&1 | tee "${GITHUB_WORKSPACE}/build-lineage-4.9.227.log"

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/kernel
          mkdir -p artifacts/dtb
          mkdir -p artifacts/modules

          boot_dir=kernel/out/arch/arm64/boot

          for image in Image Image.gz; do
            if [ -f "${boot_dir}/${image}" ]; then
              cp -v "${boot_dir}/${image}" artifacts/kernel/
            fi
          done

          for dtb in \
            kernel/out/arch/arm64/boot/dts/qcom/pyxis-*.dtb \
            kernel/out/arch/arm64/boot/dts/qcom/*pyxis*.dtb; do
            if [ -f "${dtb}" ]; then
              cp -v "${dtb}" artifacts/dtb/
            fi
          done

          if [ -d kernel/out ]; then
            find kernel/out \
              -type f \
              -name '*.ko' \
              -exec cp -v --parents {} artifacts/modules/ \; \
              2>/dev/null || true
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config artifacts/kernel/config
          fi

          cp build-lineage-4.9.227.log artifacts/ 2>/dev/null || true
          cp kernel-commit.txt artifacts/ 2>/dev/null || true

          {
            echo "Kernel repository: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo "Pinned commit: ${KERNEL_COMMIT}"
            echo "Base defconfig: ${BASE_DEFCONFIG}"
            echo "Common fragment: ${COMMON_CONFIG}"
            echo "Device fragment: ${DEVICE_CONFIG}"
            echo "Target device: Xiaomi CC9 / pyxis"
            echo "ReSukiSU enabled: false"
            echo "Use kernel/Image.gz when repacking the stock boot v2 image."
            echo "Keep the original stock DTB for the first boot test."
            echo "GitHub run: ${GITHUB_RUN_NUMBER}"
          } > artifacts/build-info.txt

          find artifacts -type f -print

      - name: Verify kernel image
        if: success()
        shell: bash
        run: |
          set -e

          test -s artifacts/kernel/Image
          test -s artifacts/kernel/Image.gz

          gzip -t artifacts/kernel/Image.gz

          if ! strings artifacts/kernel/Image \
              | grep -q '^Linux version 4\.9\.227'; then
            echo "Generated kernel is not Linux 4.9.227."
            exit 1
          fi

      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-CC9-Lineage-4.9.227-clean-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
